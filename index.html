</div>

<button onclick="nextPage()"

{title:"Prensa de Recicláveis",img:"https://source.unsplash.com/600x400/?recycling,press",desc:"Compactação de recicláveis.",details:"Papel e plástico.",dim:"180 x 140 x 160 cm",material:"Aço"},
{title:"Esteira de Triagem",img:"https://source.unsplash.com/600x400/?factory,conveyor",desc:"Separação manual.",details:"Linha de reciclagem.",dim:"Variável",material:"Metal"},
{title:"Sistema de Coleta Seletiva",img:"https://source.unsplash.com/600x400/?recycling,bins",desc:"Infraestrutura urbana.",details:"Gestão de resíduos.",dim:"Variável",material:"Plástico"},
{title:"Triturador de Vidro",img:"https://source.unsplash.com/600x400/?glass,recycling",desc:"Reciclagem de vidro.",details:"Triturador industrial.",dim:"150 x 120 x 140 cm",material:"Aço"}
]
}

]

let pages=[]
let page=0

function generatePages(){

sections.forEach(section=>{
for(let i=0;i<section.items.length;i+=2){
pages.push({
section:section.section,
items:[section.items[i],section.items[i+1]]
})
}
})

}

generatePages()

function render(){

const container=document.getElementById("page")
const title=document.getElementById("sectionTitle")

container.innerHTML=""
title.innerText=pages[page].section

pages[page].items.forEach(p=>{

container.innerHTML+=`
<div class="w-80 flex flex-col">

<img src="${p.img}" class="rounded-lg shadow-md mb-4 h-48 object-cover">

<h2 class="text-xl font-semibold text-green-800">${p.title}</h2>

<p class="text-gray-600 mt-2">${p.desc}</p>

<div class="text-sm text-gray-500 mt-3">

<p><b>Detalhes:</b> ${p.details}</p>
<p><b>Dimensões:</b> ${p.dim}</p>
<p><b>Material:</b> ${p.material}</p>

</div>

<p class="text-green-700 font-bold mt-4">Valor: Sob consulta</p>

</div>
`
})

}

function nextPage(){
if(page<pages.length-1){page++;render()}
}

function prevPage(){
if(page>0){page--;render()}
}

render()

</script>

</body>
</html>
